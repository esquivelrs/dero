/radar/scekf_dero_node:
  ros__parameters:
    est_save_dir: "/home/ros/rosbags_shared/rio_ar_novatel.txt"

    world_frame_id: "world"
    radar_frame_id: "tractor_radar_bosch_bottom"
    imu_frame_id: "tractor_gnss_left_imu"
    robot_frame_id: "base_link"
    use_tf_from_params: true

    # imu_body_rotation_offset_x: 1.019
    # imu_body_rotation_offset_y: 0.012
    # imu_body_rotation_offset_z: -1.383

    imu_body_rotation_offset_x: 0.0
    imu_body_rotation_offset_y: 0.0
    imu_body_rotation_offset_z: 0.0

    #0.712, -0.434, -1.077
    #-0.779, 0.457, 1.020
    #−0.71126,0.40171,1.04076
    # 0.68368,0.41922,1.05228

    # imu_radar_position_offset_x: 0.712
    # imu_radar_position_offset_y: -0.434
    # imu_radar_position_offset_z: -1.077

    # imu_radar_position_offset_x: -0.71126
    # imu_radar_position_offset_y: 0.40171
    # imu_radar_position_offset_z: 1.04076

    imu_radar_position_offset_x: 0.68368
    imu_radar_position_offset_y: 0.41922
    imu_radar_position_offset_z: 1.05228

    #0.011, 0.032, 0.000, 0.999

    # imu_radar_quaternion_offset_w: 0.999
    # imu_radar_quaternion_offset_x: 0.011
    # imu_radar_quaternion_offset_y: 0.032
    # imu_radar_quaternion_offset_z: 0.000  

    #0.9997,−0.0088,0.0166,−0.0142  
    #0.9997,−0.0088,0.0166,0.0142
      
    
    # imu_radar_quaternion_offset_w: -0.0142
    # imu_radar_quaternion_offset_x: 0.9997
    # imu_radar_quaternion_offset_y: -0.0088
    # imu_radar_quaternion_offset_z: 0.0166 

    imu_radar_quaternion_offset_x: 0.9997
    imu_radar_quaternion_offset_y: -0.0088
    imu_radar_quaternion_offset_z: 0.0166
    imu_radar_quaternion_offset_w: -0.0142


    # imu_radar_quaternion_offset_w: 1.0
    # imu_radar_quaternion_offset_x: 0.0
    # imu_radar_quaternion_offset_y: 0.0
    # imu_radar_quaternion_offset_z: 0.0
    gravity: 9.81

    # Initial Covariance Values
    P_init_position: 1.0e-10             # Assuming precise initial position
    P_init_velocity: 1.0e-10             # Assuming precise initial velocity
    P_init_attitude_XY: 1.0e-10          # Assuming precise initial attitude in XY
    P_init_attitude_Z: 1.0e-10           # Assuming precise initial attitude in Z
    P_init_accel_bias: 3.7201e-07        # Calculated from accelerometer bias instability
    P_init_gyro_bias: 1.2097e-10         # Calculated from gyroscope bias instability
    P_init_radar_scale: 1.0e-6           # Keeping the same unless radar specs have changed

    # Process Noise Parameters
    velocity_random_walk: 0.0014492691797967651   # From accelerometer noise density
    angular_random_walk: 3.473e-5                 # From gyroscope noise density
    accel_bias_random_walk: 1.0167e-5             # From accelerometer bias instability
    gyro_bias_random_walk: 1.8326e-7              # From gyroscope bias instability
    radar_scale_random_walk: 1.0e-6               # Keeping the same unless radar specs have changed

    use_radar: true
    use_dr_structure: false
    use_cloning: false
    imu_only: false
    groundtruth_included: false
    radar_outlier_reject: true
    ros2_pub_rate: 30
    coarse_alignment_window_size: 5000

    min_distance: 0.25
    max_distance: 300.0
    min_db: 3.0
    elevation_threshold: 120.0
    azimuth_threshold: 120.0
    velocity_correction_factor: 1.0
    filter_min_z: -100.0
    filter_max_z: 100.0
    zero_velocity_threshold: 0.05
    sigma_zero_velocity_x: 0.025
    sigma_zero_velocity_y: 0.025
    sigma_zero_velocity_z: 0.025
    allowed_outlier_percentage: 0.25
    max_sigma_x: 0.2
    max_sigma_y: 0.15
    max_sigma_z: 0.001
    max_r_cond: 1.0e3

    use_ransac: true
    outlier_prob: 0.5
    success_prob: 0.999
    N_ransac_points: 3
    inlier_threshold: 0.15

    sigma_offset_radar_x: 0.1
    sigma_offset_radar_y: 0.1
    sigma_offset_radar_z: 0.1
    outlier_percentil_radar: 0.1

    use_odr: true
    min_speed_odr: 4.0
    sigma_v_d: 0.125
    model_noise_offset_deg: 2.0
    model_noise_scale_deg: 10.0
    odr_inlier_threshold: 10

    # max_corres_dis: 0.5
    # max_iter: 500
    # transform_eps: 0.00000001
    # euclidean_fit_eps: 0.00000001
    # cloning_window_size: 3
    # window_slicing: false
    # ransac_outlier_reject_thres: 0.01
    # icp_std_x: 0.5
    # icp_std_y: 0.5
    # icp_std_z: 0.5
    # accel_angle_adapt: 2.0

    max_corres_dis: 4.0
    max_iter: 500
    transform_eps: 0.00000001
    euclidean_fit_eps: 0.00000001
    cloning_window_size: 3
    window_slicing: false
    ransac_outlier_reject_thres: 0.01
    icp_std_x: 0.5
    icp_std_y: 0.5
    icp_std_z: 0.5
    accel_angle_adapt: 2.0